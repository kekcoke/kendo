name: CI — Build, Test, Docker Compose

on:
  push:
    branches: [develop, "feature/**"]
  pull_request:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: kendo_users
          POSTGRES_USER: kendo
          POSTGRES_PASSWORD: kendo_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build solution
        run: dotnet build src/Kendo.slnx

      - name: Run unit tests
        run: dotnet test src/Kendo.slnx --filter "Category=Unit" --no-build

      - name: Run data integration tests
        run: dotnet test src/Kendo.slnx --filter "Category=Data" --no-build
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=kendo_users;Username=kendo;Password=kendo_dev

      - name: Run resilience tests
        run: dotnet test src/Kendo.slnx --filter "Category=Resilience" --no-build

      - name: Run messaging tests
        run: dotnet test src/Kendo.slnx --filter "Category=Messaging" --no-build

  docker-compose:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for healthy
        run: |
          expected="gateway,userservice,worker,postgres"
          for i in $(seq 1 15); do
            healthy=$(docker compose ps --format json | grep '"Health":"healthy"' | wc -l)
            if [ "$healthy" -ge 4 ]; then
              echo "All 4 services healthy."
              exit 0
            fi
            echo "wait ($i/15): $healthy/4 services healthy"
            sleep 4
          done
          docker compose ps
          echo "FAILED: not all services became healthy within the timeout."
          exit 1

      - name: Verify health endpoints
        run: |
          curl -fsS http://localhost:5000/health/live
          curl -fsS http://localhost:5000/health/ready
          curl -fsS http://localhost:5001/health/live
          curl -fsS http://localhost:5001/health/ready
          curl -fsS http://localhost:5002/health/live
          curl -fsS http://localhost:5002/health/ready

      - name: Tear down
        if: always()
        run: docker compose down
