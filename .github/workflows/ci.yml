name: CI — Build, Test, Docker Compose

on:
  push:
    branches: [develop, "feature/**"]
  pull_request:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: kendo_users
          POSTGRES_USER: kendo
          POSTGRES_PASSWORD: kendo_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build solution
        run: dotnet build src/Kendo.slnx

      - name: Run unit tests
        run: dotnet test src/Kendo.slnx --filter "Category=Unit" --no-build

      - name: Run data integration tests
        run: dotnet test src/Kendo.slnx --filter "Category=Data" --no-build
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=kendo_users;Username=kendo;Password=kendo_dev

      - name: Run resilience tests
        run: dotnet test src/Kendo.slnx --filter "Category=Resilience" --no-build

      - name: Run messaging tests
        run: dotnet test src/Kendo.slnx --filter "Category=Messaging" --no-build

  docker-compose:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for healthy
        run: |
          for i in $(seq 1 20); do
            healthy=$(docker compose ps --format json | grep '"Health":"healthy"' | wc -l)
            if [ "$healthy" -ge 5 ]; then
              echo "All 5 services healthy (gateway, userservice, worker, postgres, nginx)."
              exit 0
            fi
            echo "wait ($i/20): $healthy/5 services healthy"
            sleep 4
          done
          docker compose ps
          echo "FAILED: not all services became healthy within the timeout."
          exit 1

      - name: Verify health endpoints (single replica)
        run: |
          echo "=== Gateway via NGINX ==="
          curl -fsS http://localhost:5000/health/live
          curl -fsS http://localhost:5000/health/ready
          echo ""
          echo "=== NGINX self-health ==="
          curl -fsS http://localhost:5000/nginx-health

      - name: Tear down (single replica)
        run: docker compose down

      - name: Start multi-replica
        run: docker compose up -d --scale gateway=3 --scale userservice=3 --scale worker=3

      - name: Wait for 11 containers healthy
        run: |
          for i in $(seq 1 20); do
            healthy=$(docker compose ps --format json | grep '"Health":"healthy"' | wc -l)
            if [ "$healthy" -ge 11 ]; then
              echo "All 11 containers healthy."
              exit 0
            fi
            echo "wait ($i/20): $healthy/11 containers healthy"
            sleep 4
          done
          docker compose ps
          echo "FAILED: not all containers became healthy within the timeout."
          exit 1

      - name: Smoke test through NGINX
        run: |
          echo "=== Health check through NGINX ==="
          curl -fsS http://localhost:5000/health/live
          echo ""
          echo "=== POST through NGINX to UserService (retry up to 5x for circuit breaker warmup) ==="
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              http://localhost:5000/api/users \
              -H 'Content-Type: application/json' \
              -d '{"email":"ci@test.com","displayName":"CI Test"}')
            if [ "$STATUS" = "202" ]; then
              echo " ✓ 202 Accepted (attempt $i)"
              exit 0
            fi
            echo "  attempt $i: $STATUS (retrying in 10s...)"
            sleep 10
          done
          echo " ✗ failed after 5 attempts"
          curl -s -X POST \
            http://localhost:5000/api/users \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci-debug@test.com","displayName":"Debug"}'
          exit 1

      - name: Verify traffic distribution
        run: |
          OUTPUTS=""
          for i in $(seq 1 10); do
            OUTPUTS="$OUTPUTS $(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health/live)"
          done
          echo "10 health checks through NGINX: $OUTPUTS"
          # Verify none returned 502 (load balancer failure)
          if echo "$OUTPUTS" | grep -q "502"; then
            echo "FAILED: some requests returned 502 (upstream unhealthy)"
            exit 1
          fi
          echo "✓ All 10 requests proxied successfully through NGINX"

      - name: Tear down (multi-replica)
        if: always()
        run: docker compose down