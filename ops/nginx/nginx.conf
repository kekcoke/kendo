events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS resolver — lazy upstream resolution
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        client_max_body_size 10m;

        # Proxy headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # Proxy timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # NGINX self-health — returns 200 if NGINX is running
        location /nginx-health {
            return 200 "nginx OK\n";
        }

        # Health endpoints — proxy to Gateway (primary)
        # Variable-based proxy_pass + $request_uri preserves URI path
        # while enabling lazy DNS resolution.
        location /health/ {
            set $gateway_upstream "http://gateway:5000";
            proxy_pass $gateway_upstream$request_uri;
        }

        # User service API
        location /api/users {
            set $userservice_upstream "http://userservice:5001";
            proxy_pass $userservice_upstream$request_uri;
        }

        # All other traffic — Gateway handles routing
        location / {
            set $gateway_upstream "http://gateway:5000";
            proxy_pass $gateway_upstream$request_uri;
        }
    }
}
