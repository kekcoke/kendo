events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS resolver — required for lazy upstream resolution
    resolver 127.0.0.11 valid=10s;

    # Upstream groups use variables so NGINX resolves hostnames at request time,
    # not at config load. This prevents "[emerg] host not found in upstream"
    # errors when dependent containers are still starting their DNS entries.
    map $upstream_gateway $backend_gateway {
        default http://gateway:5000;
    }
    map $upstream_userservice $backend_userservice {
        default http://userservice:5001;
    }

    server {
        listen 80;
        client_max_body_size 10m;

        # Proxy headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # Proxy timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # NGINX self-health — returns 200 if NGINX is running
        location /nginx-health {
            return 200 "nginx OK\n";
        }

        # Health endpoints — proxy to Gateway (primary)
        location /health/ {
            set $upstream_gateway "gateway:5000";
            proxy_pass $backend_gateway;
        }

        # User service API
        location /api/users {
            set $upstream_userservice "userservice:5001";
            proxy_pass $backend_userservice;
        }

        # All other traffic — Gateway handles routing
        location / {
            set $upstream_gateway "gateway:5000";
            proxy_pass $backend_gateway;
        }
    }
}
