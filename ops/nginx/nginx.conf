events {
    worker_connections 1024;
}

http {
    upstream backend_gateway {
        server gateway:5000 max_fails=3 fail_timeout=10s;
    }

    upstream backend_userservice {
        server userservice:5001 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        client_max_body_size 10m;

        # Proxy headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # Proxy timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Health endpoints — proxy to Gateway (primary)
        location /health/ {
            proxy_pass http://backend_gateway;
        }

        # User service API
        location /api/users {
            proxy_pass http://backend_userservice;
        }

        # All other traffic — Gateway handles routing
        location / {
            proxy_pass http://backend_gateway;
        }
    }
}
