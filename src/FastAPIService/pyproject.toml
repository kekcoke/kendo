[project]
name = "kendo-fastapi"
version = "0.1.0"
description = "Kendo AI/Vector Service — FastAPI + LangChain + pgvector"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pydantic-settings[dotenv]>=2.7.0",
    "asyncpg>=0.31.0",
    "httpx>=0.28.0",
    "pyjwt>=2.10.0",
    "cryptography>=44.0.0",
    "langchain>=1.3.0",
    "langchain-community>=0.4.0",
    "sentence-transformers>=3.4.0",
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
