services:
  gateway:
    build:
      context: ./src
      dockerfile: Gateway/Dockerfile
    expose:
      - "5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - DOTNET_ENVIRONMENT=Development
      - Redis__ConnectionString=redis:6379
      - Kendo__Jwt__PrivateKeyPath=secrets/jwt-private.pem
      - Kendo__Jwt__Issuer=https://gateway.local/.well-known/jwks.json
      - Kendo__Jwt__Audience=kendo.api
      - Kendo__Jwt__RotationDays=90
      - Kendo__Jwt__TokenLifetimeMinutes=60
      - Kendo__Jwt__ServiceTokenLifetimeSeconds=60
      - Kendo__FastApi__BaseUrl=http://fastapi:8000
      - Kendo__FastApi__TimeoutSeconds=30
      - Kendo__FastApi__CircuitBreakerFailures=3
      - Kendo__FastApi__CircuitBreakerBreakSeconds=30
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  userservice:
    build:
      context: ./src
      dockerfile: UserService/Dockerfile
    expose:
      - "5001"
    environment:
      - ASPNETCORE_URLS=http://+:5001
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=kendo_users;Username=kendo;Password=kendo_dev
      - Redis__ConnectionString=redis:6379
      - KENDO__EVENT_EMBEDDING__DIM=1024
      - KENDO__EVENT_EMBEDDING__MODEL=BGE-large-en-v1.5
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ./src
      dockerfile: Worker/Dockerfile
    expose:
      - "5002"
    environment:
      - ASPNETCORE_URLS=http://+:5002
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=kendo_users;Username=kendo;Password=kendo_dev
      - Redis__ConnectionString=redis:6379
      - Rebus__AiWorkers=2
      - Rebus__AiParallelism=5
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=kendo
      - POSTGRES_PASSWORD=kendo_dev
      - POSTGRES_DB=kendo_users
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kendo -d kendo_users"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    ports:
      - "5000:80"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
      userservice:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  pgdata:
